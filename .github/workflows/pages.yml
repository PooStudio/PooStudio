name: Build and deploy static site

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build static site from PHP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './node_modules/*' -print0)

      - name: Render PHP pages for static hosting
        run: php php/build-static.php

      - name: Verify static output
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          for page in home about offline privacy terms; do
            test -s "_site/$page/index.html"
          done
          test -f _site/assets/css/home.css
          test -f _site/sw.js
          test -f _site/CNAME
          if find _site -type f -name '*.php' -print -quit | grep -q .; then
            echo "PHP source files must not be published."
            exit 1
          fi
          if grep -R -E '\.(php|html)' _site --include='*.html'; then
            echo "File-extension links remain in the static site."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy site
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
